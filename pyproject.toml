[project]
name = "dspy-jev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "solo-burn" }
]
requires-python = ">=3.11"
dependencies = [
    "dspy[typesafeai]>=3.4.1",
    "ruff>=0.17.2",
]

